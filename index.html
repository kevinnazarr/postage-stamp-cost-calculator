<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Postage Stamp Cost Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Postage Stamp Cost Calculator</h1>

    <section class="calculator" aria-label="Postage calculator">
      <div class="form-group">
        <label for="weight">Package Weight (ounces)</label>
        <input
          type="number"
          id="weight"
          min="0.1"
          step="0.1"
          placeholder="e.g. 3.5"
          aria-describedby="weight-help"
        >
        <span id="weight-help" class="help-text">Enter the weight of your package</span>
        <span id="weight-error" class="error-text" role="alert" hidden>Please enter a valid weight.</span>
      </div>

      <div class="form-group">
        <label for="mailType">Mail Type</label>
        <select id="mailType">
          <option value="first-class-letter">First-Class Letter</option>
          <option value="first-class-large-envelope">First-Class Large Envelope</option>
          <option value="priority-mail-flat-rate">Priority Mail Flat Rate</option>
        </select>
      </div>

      <button id="calculateBtn" type="button">Calculate Postage</button>
    </section>

    <section id="resultSection" class="result-section" hidden aria-label="Cost breakdown">
      <h2>Estimated Postage</h2>
      <div class="cost-breakdown">
        <div class="cost-row">
          <span class="cost-label">Base Rate</span>
          <span id="baseRate" class="cost-value">—</span>
        </div>
        <div class="cost-row">
          <span class="cost-label">Weight Overage</span>
          <span id="overageFee" class="cost-value">—</span>
        </div>
        <div class="cost-row cost-total">
          <span class="cost-label">Total</span>
          <span id="totalCost" class="cost-value cost-highlight">—</span>
        </div>
      </div>
    </section>

    <section id="historySection" class="history-section" hidden aria-label="Recent calculations">
      <h2>Recent Calculations</h2>
      <ul id="historyList" class="history-list"></ul>
      <button id="clearHistoryBtn" type="button" class="btn-secondary">Clear History</button>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
